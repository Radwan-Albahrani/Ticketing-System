name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and architecture
            command: bun run lint
          - name: Format
            command: bun fmt --check
          - name: TypeScript 7
            command: bun check --no-script
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pull isolated test infrastructure
        run: docker compose -f compose.test.yaml pull --quiet
      - run: bun test
      - name: Clean up test infrastructure
        if: always()
        run: docker compose -f compose.test.yaml down -v
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run build
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Validate Conventional Commits
        shell: bash
        run: |
          git rev-list HEAD | while IFS= read -r revision; do
            git show -s --format=%B "$revision" | bun run commitlint
          done
  docker:
    name: Docker startup and API smoke test
    needs: [quality, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: bun tools/smoke.ts
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up application infrastructure
        if: always()
        run: docker compose down -v
